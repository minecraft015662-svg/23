<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geeken admin</title>
<style>
:root{--bg:#0f1220;--card:#171a2e;--line:#2a2f55;--text:#e8e9f3;--muted:#8a8fb5;--accent:#6c63ff;--ok:#7ee0b0;--bad:#f09595}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 16px}
h1{font-size:1.4rem;margin:0 0 16px}h2{font-size:1.05rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
input,select,button{font:inherit;border-radius:8px;border:1px solid var(--line);background:#1c2040;color:var(--text);padding:8px 10px}
button{cursor:pointer;background:var(--accent);border-color:var(--accent);color:#fff}button.alt{background:#252a52;border-color:var(--line);color:#c9cbe6}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.wrap{overflow-x:auto}.msg{min-height:20px;font-size:13px;color:var(--muted)}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
code{font-family:ui-monospace,monospace;color:#a9a3ff}.hidden{display:none}
</style></head><body><main>
<h1>Geeken admin</h1>

<div id="login" class="card" style="max-width:360px">
  <h2>Sign in</h2>
  <div class="row"><input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn">Sign in</button></div>
  <div id="loginMsg" class="msg"></div>
</div>

<div id="app" class="hidden">
  <div class="card">
    <h2>Create license</h2>
    <div class="row">
      <input id="email" type="email" placeholder="customer@email.com">
      <select id="type"><option value="theme">Theme only</option><option value="both">Theme + addon</option></select>
      <select id="days"><option value="30">30 days</option><option value="365">1 year</option><option value="0">Lifetime</option></select>
      <button id="createBtn">Create and email</button>
    </div>
    <div id="createMsg" class="msg"></div>
  </div>

  <div class="card"><h2>Licenses</h2><div class="wrap"><table><thead><tr><th>Key</th><th>Email</th><th>Type</th><th>Status</th><th>Domain</th><th>Expires</th><th></th></tr></thead><tbody id="lic"></tbody></table></div></div>

  <div class="card">
    <h2>Bot API keys</h2>
    <div class="row"><input id="kname" placeholder="Key name, for example Discord bot"><button id="keyBtn">Create key</button></div>
    <div id="keyMsg" class="msg"></div>
    <div class="wrap"><table><thead><tr><th>Name</th><th>Created</th><th>Status</th><th></th></tr></thead><tbody id="keys"></tbody></table></div>
  </div>
</div>
</main>
<script>
var token=sessionStorage.getItem('gk_admin')||'';
function $(id){return document.getElementById(id);}
function say(id,t,c){var e=$(id);e.textContent=t;e.className='msg '+(c||'');}
function api(path,opt){opt=opt||{};opt.headers=Object.assign({'Content-Type':'application/json',Authorization:'Bearer '+token},opt.headers||{});
  return fetch(path,opt).then(function(r){return r.json().then(function(j){if(r.status===401){logout();}if(!r.ok)throw new Error(j.error||'Request failed');return j;});});}
function cell(tr,text,mono){var td=document.createElement('td');if(mono){var c=document.createElement('code');c.textContent=text;td.appendChild(c);}else td.textContent=text;tr.appendChild(td);return td;}
function btn(label,fn,cls){var b=document.createElement('button');b.textContent=label;if(cls)b.className=cls;b.addEventListener('click',fn);return b;}
function fmt(ms){return ms?new Date(ms).toLocaleDateString():'Lifetime';}
function logout(){token='';sessionStorage.removeItem('gk_admin');$('app').classList.add('hidden');$('login').classList.remove('hidden');}
function show(){$('login').classList.add('hidden');$('app').classList.remove('hidden');load();}
function load(){
  api('/admin/licenses').then(function(rows){var b=$('lic');b.textContent='';rows.forEach(function(l){var tr=document.createElement('tr');
    cell(tr,l.key,true);cell(tr,l.email);cell(tr,l.type==='both'?'Theme + addon':'Theme only');cell(tr,l.status);cell(tr,l.domain||'Not used yet');cell(tr,fmt(l.expires_at));
    var td=document.createElement('td');td.className='row';
    td.appendChild(btn('Revoke',function(){api('/admin/licenses/'+l.key+'/revoke',{method:'POST'}).then(load);},'alt'));
    td.appendChild(btn('Reset domain',function(){api('/admin/licenses/'+l.key+'/reset-domain',{method:'POST'}).then(load);},'alt'));
    td.appendChild(btn('Delete',function(){if(confirm('Delete this license?'))api('/admin/licenses/'+l.key,{method:'DELETE'}).then(load);},'alt'));
    tr.appendChild(td);b.appendChild(tr);});}).catch(function(){});
  api('/admin/apikeys').then(function(rows){var b=$('keys');b.textContent='';rows.forEach(function(k){var tr=document.createElement('tr');
    cell(tr,k.name);cell(tr,new Date(k.created_at).toLocaleDateString());cell(tr,k.revoked?'revoked':'active');
    var td=document.createElement('td');if(!k.revoked)td.appendChild(btn('Revoke',function(){api('/admin/apikeys/'+k.id,{method:'DELETE'}).then(load);},'alt'));
    tr.appendChild(td);b.appendChild(tr);});}).catch(function(){});
}
$('loginBtn').addEventListener('click',function(){
  if(!$('u').value||!$('p').value){say('loginMsg','Enter your username and password','err');return;}
  fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})})
    .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error);return j;});})
    .then(function(j){token=j.token;sessionStorage.setItem('gk_admin',token);say('loginMsg','');show();})
    .catch(function(e){say('loginMsg',e.message,'err');});
});
$('createBtn').addEventListener('click',function(){
  var email=$('email').value.trim();if(!email){say('createMsg','Enter the customer email','err');return;}
  api('/admin/licenses',{method:'POST',body:JSON.stringify({email:email,type:$('type').value,days:Number($('days').value)})})
    .then(function(l){say('createMsg','Created '+l.key+(l.emailed?' and emailed it':' (email is not configured, key shown here only)'),'ok');$('email').value='';load();})
    .catch(function(e){say('createMsg',e.message,'err');});
});
$('keyBtn').addEventListener('click',function(){
  var n=$('kname').value.trim();if(!n){say('keyMsg','Enter a name for the key','err');return;}
  api('/admin/apikeys',{method:'POST',body:JSON.stringify({name:n})})
    .then(function(j){say('keyMsg','Copy this key now, it is shown once: '+j.key,'ok');$('kname').value='';load();})
    .catch(function(e){say('keyMsg',e.message,'err');});
});
if(token)show();
</script></body></html>
